name: Monthly Changelog

on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to process (YYYY-MM). Defaults to previous month."
        required: false
        type: string
      dry_run:
        description: "Generate output without pushing or creating a PR"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Documentation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests openai

      - name: Validate inputs
        run: |
          if [ -n "${{ inputs.month }}" ]; then
            if ! echo "${{ inputs.month }}" | grep -Eq '^[0-9]{4}-[0-9]{2}$'; then
              echo "ERROR: month must be YYYY-MM, got: ${{ inputs.month }}"
              exit 1
            fi
          fi

      - name: Generate monthly changelog
        env:
          CHANGELOG_GH_PAT: ${{ secrets.CHANGELOG_GH_PAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ env.GROQ_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${{ inputs.month }}" ]; then
            ARGS="$ARGS --month ${{ inputs.month }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          # scheduled run defaults to previous month and non-dry-run
          # manual run respects inputs
          python scripts/monthly-changelog/generate.py $ARGS --output-dir .

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changelog-${{ inputs.month || 'scheduled' }}-${{ github.run_id }}
          path: |
            prs-*.json
            changelog.patch
          retention-days: 90
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "### Monthly Changelog Run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Target month: \`${{ inputs.month || 'previous month (auto)' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Dry run: \`${{ inputs.dry_run }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts: \`prs-*.json\` + \`changelog.patch\` (90 days)" >> $GITHUB_STEP_SUMMARY
          if [ -f changelog.patch ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>changelog.patch</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```diff' >> $GITHUB_STEP_SUMMARY
            head -n 200 changelog.patch >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f prs-*.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Raw PRs artifact uploaded." >> $GITHUB_STEP_SUMMARY
          fi
